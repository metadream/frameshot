<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <link rel="stylesheet" type="text/css" href="assets/style.css">
  <script src="src/renderer/index.js" type="module" defer></script>
</head>
<body>

<header>
  <div>
    <button class="window-control" id="close-btn"><img src="assets/icons/close.svg"/></button>
    <button class="window-control" id="minimize-btn"><img src="assets/icons/minimize.svg"/></button>
    <button class="window-control" id="maximize-btn"><img src="assets/icons/maximize.svg"/></button>
  </div>

  <div class="info-bar">
    <div class="file-info"></div>
    <div class="image-info"></div>
  </div>

  <div>
    <button id="refresh-btn" disabled><img src="assets/icons/refresh.svg"/></button>

    <menu>
      <button id="sort-btn" disabled><img src="assets/icons/sort.svg"/></button>
      <div class="menu-items" id="sort-items">
        <span data-field="name"><i></i>按名称</span>
        <span data-field="format"><i></i>按格式</span>
        <span data-field="mtime"><i></i>按时间</span>
        <span data-field="size"><i></i>按大小</span>
        <span data-field="resolution"><i></i>按尺寸</span>
      </div>
    </menu>

    <menu>
      <button id="convert-btn" disabled><img src="assets/icons/image.svg"/></button>
      <div class="menu-items" id="convert-items">
        <span data-format="jpg">转换为 JPG</span>
        <span data-format="png">转换为 PNG</span>
      </div>
    </menu>

    <button id="open-btn"><img src="assets/icons/folder.svg"/></button>
  </div>
</header>

<main><img></main>
</body>
</html>
