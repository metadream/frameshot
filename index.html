<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: frameshot:;">
  <link rel="stylesheet" type="text/css" href="assets/style.css">
  <script src="src/renderer/index.js" type="module" defer></script>
</head>
<body>

<header>
  <div class="window-controls">
    <button id="close-btn"><img src="assets/icons/close.svg"/></button>
    <button id="minimize-btn"><img src="assets/icons/minimize.svg"/></button>
    <button id="maximize-btn"><img src="assets/icons/maximize.svg"/></button>
  </div>

  <div class="info-bar">
    <div id="file-count">FrameShot v2.0.0</div>
    <div id="file-name"></div>
    <div id="dimensions"></div>
    <div id="file-size"></div>
  </div>

  <div class="menu-icons">
    <button id="refresh-btn" title="Reload" disabled><img src="assets/icons/refresh.svg"/></button>

    <menu>
      <button id="sort-btn" title="Sort" disabled><img src="assets/icons/sort.svg"/></button>
      <div class="menu-items" id="sort-items">
        <span data-field="name"><i></i>Name</span>
        <span data-field="format"><i></i>Format</span>
        <span data-field="mtime"><i></i>Time</span>
        <span data-field="size"><i></i>Size</span>
      </div>
    </menu>

    <menu>
      <button id="convert-btn" title="Convert" disabled><img src="assets/icons/convert.svg"/></button>
      <div class="menu-items" id="convert-items">
        <span data-format="jpg">to JPG</span>
        <span data-format="png">to PNG</span>
      </div>
    </menu>

    <menu>
      <button id="crop-btn" title="Crop" disabled><img src="assets/icons/crop.svg"/></button>
      <div class="menu-items" id="crop-items">
        <span data-ratio="1:1">1:1</span>
        <span data-ratio="3:2">3:2</span>
        <span data-ratio="4:3">4:3</span>
        <span data-ratio="16:9">16:9</span>
      </div>
    </menu>

    <button id="open-btn" title="Open"><img src="assets/icons/open.svg"/></button>
  </div>
</header>

<main>
  <div class="welcome" id="welcome">
    <img class="welcome-icon" src="assets/build/icon.png" alt="FrameShot"/>
    <h1>FrameShot</h1>
    <button class="welcome-open" id="welcome-open-btn">Open or Drop Image</button>
    <p>Support JPG, PNG, GIF, WebP, BMP, SVG, etc.</p>

    <div class="welcome-shortcuts">
      <div><kbd>←</kbd><kbd>→</kbd> <span>Switch Image</span></div>
      <div><kbd>↑</kbd><kbd>↓</kbd> <span>Zoom In/Out</span></div>
      <div><kbd>Scroll</kbd> <span>Zoom In/Out</span></div>
      <div><kbd>Enter</kbd> <span>Toggle Original Size</span></div>
      <div><kbd>Esc</kbd> <span>Cancel Crop</span></div>
      <div><kbd>Delete</kbd> <span>Delete Image</span></div>
    </div>
  </div>

  <div class="loading" id="loading"></div>
  <img id="image-viewer">
</main>

</body>
</html>
