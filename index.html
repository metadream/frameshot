<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <link rel="stylesheet" type="text/css" href="assets/style.css">
  <script src="src/renderer/index.js" type="module" defer></script>
</head>
<body>

<header>
  <div class="window-controls">
    <button id="close-btn"><img src="assets/icons/close.svg"/></button>
    <button id="minimize-btn"><img src="assets/icons/minimize.svg"/></button>
    <button id="maximize-btn"><img src="assets/icons/maximize.svg"/></button>
  </div>

  <div class="info-bar">
    <div class="file-info"></div>
    <div class="image-info"></div>
  </div>

  <div>
    <button id="refresh-btn" title="刷新" disabled><img src="assets/icons/refresh.svg"/></button>

    <menu>
      <button id="sort-btn" title="排序" disabled><img src="assets/icons/sort.svg"/></button>
      <div class="menu-items" id="sort-items">
        <span data-field="name"><i></i>按名称</span>
        <span data-field="format"><i></i>按格式</span>
        <span data-field="mtime"><i></i>按时间</span>
        <span data-field="size"><i></i>按大小</span>
        <span data-field="resolution"><i></i>按尺寸</span>
      </div>
    </menu>

    <menu>
      <button id="convert-btn" title="转换" disabled><img src="assets/icons/convert.svg"/></button>
      <div class="menu-items" id="convert-items">
        <span data-format="jpg">转换为 JPG</span>
        <span data-format="png">转换为 PNG</span>
      </div>
    </menu>

    <menu>
      <button id="crop-btn" title="裁切" disabled><img src="assets/icons/crop.svg"/></button>
      <div class="menu-items" id="crop-items">
        <span data-ratio="1:1">1:1</span>
        <span data-ratio="3:2">3:2</span>
        <span data-ratio="2:3">2:3</span>
        <span data-ratio="4:3">4:3</span>
        <span data-ratio="3:4">3:4</span>
        <span data-ratio="16:9">16:9</span>
        <span data-ratio="9:16">9:16</span>
      </div>
    </menu>

    <button id="open-btn" title="打开"><img src="assets/icons/open.svg"/></button>
  </div>
</header>

<main>
  <div class="welcome" id="welcome">
    <img class="welcome-icon" src="assets/build/icon.png" alt="FrameShot"/>
    <h1>FrameShot</h1>
    <button class="welcome-open" id="welcome-open-btn">Open or Drop Image</button>
    <p>Support JPG, PNG, GIF, WebP, BMP, SVG, etc.</p>

    <div class="welcome-shortcuts">
      <div><kbd>←</kbd><kbd>→</kbd> <span>Switch Image</span></div>
      <div><kbd>↑</kbd><kbd>↓</kbd> <span>Toggle Original Size</span></div>
      <div><kbd>Scroll</kbd> <span>Zoom In/Out</span></div>
      <div><kbd>Enter</kbd> <span>Save Crop</span></div>
      <div><kbd>Esc</kbd> <span>Cancel Crop</span></div>
      <div><kbd>Delete</kbd> <span>Delete Image</span></div>
    </div>
  </div>
  <img>
</main>

</body>
</html>
